<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sains Tingkatan 1 - 光学成像配对小游戏</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .scoreboard {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: bold;
            color: #e67e22;
        }
        .game-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }
        @media (max-width: 600px) {
            .game-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        .card {
            background-color: #3498db;
            color: white;
            font-size: 0.85rem;
            font-weight: bold;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 8px;
            text-align: center;
        }
        .card:hover {
            background-color: #2980b9;
        }
        .card.flipped {
            background-color: #ffffff;
            color: #2c3e50;
            border: 2px solid #3498db;
            transform: scale(1.02);
        }
        .card.matched {
            background-color: #2ecc71;
            color: white;
            cursor: default;
            border: none;
            opacity: 0.8;
        }
        #restart-btn {
            margin-top: 25px;
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #restart-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <h1>镜子成像特点记忆大考验</h1>
    <p class="subtitle">点击卡片，把“镜子名称”和它的“成像特点”正确配对！</p>
    
    <div class="scoreboard">得分: <span id="score">0</span> / 4</div>

    <div class="game-container" id="gameBoard"></div>

    <button id="restart-btn" onclick="startGame()">重新开始游戏</button>

    <script>
        // 游戏配对数据（镜子与特点）
        const rawData = [
            { id: 1, text: "平面镜 (Cermin Muka)\n- 虚像、一样大、正立、左右相反" },
            { id: 2, text: "凹镜 - 远处 (Cermin Cekung - Jauh)\n- 实像、更小、倒立" },
            { id: 3, text: "凹镜 - 近处 (Cermin Cekung - Dekat)\n- 虚像、更大、正立" },
            { id: 4, text: "凸镜 (Cermin Cembung)\n- 虚像、更小、正立" }
        ];

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let lockBoard = false;

        function startGame() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            cards = [];
            flippedCards = [];
            matchedPairs = 0;
            document.getElementById('score').innerText = matchedPairs;
            lockBoard = false;

            // 复制成两份：一份是名称，一份是特点（为了简化，这里直接做成卡片点击配对或直接记忆，
            // 也可以做成 8 张卡片：4张镜子名字，4张特点说明）
            let deck = [];
            rawData.forEach(item => {
                deck.push({ pairId: item.id, content: item.name ? item.name : item.text.split('\n')[0] }); // 简化的卡片
                deck.push({ pairId: item.id, content: item.text });
            });

            // 打乱顺序
            deck.sort(() => Math.random() - 0.5);

            // 生成 DOM
            deck.forEach((item, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.pairId = item.pairId;
                card.dataset.index = index;
                card.innerHTML = "点击翻开 ❓";
                card.fullText = item.content;
                
                card.addEventListener('click', flipCard);
                board.appendChild(card);
                cards.push(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

            this.classList.add('flipped');
            this.innerHTML = this.fullText.replace(/\n/g, '<br>');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                checkForMatch();
            }
        }

        function checkForMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.pairId === card2.dataset.pairId;

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                document.getElementById('score').innerText = matchedPairs;
                resetTurn();

                if (matchedPairs === rawData.length) {
                    setTimeout(() => {
                        alert("太棒了！你已经成功记住了所有的光学成像特点！🎉");
                    }, 300);
                }
            } else {
                lockBoard = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card1.innerHTML = "点击翻开 ❓";
                    card2.classList.remove('flipped');
                    card2.innerHTML = "点击翻开 ❓";
                    resetTurn();
                }, 1200);
            }
        }

        function resetTurn() {
            flippedCards = [];
            lockBoard = false;
        }

        // 初始化启动
        startGame();
    </script>
</body>
</html>
